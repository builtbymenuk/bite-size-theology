# Quality gate for every PR and every push to main. deploy.yml also calls this (workflow_call), so
# a production deploy can't run unless the whole suite is green.
#
# Nothing here has production secrets: unit/route tests stub every service, e2e runs the built site
# with all secrets blanked (fallback content, no email/payments), and the CMS tests use a throwaway
# sqlite file with dummy keys.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  web:
    name: Website — lint, types, tests, build, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      # Critical vulnerabilities in what ships to production fail the build.
      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=critical

  e2e:
    name: Website — end-to-end (Chromium + WebKit, desktop + mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      # playwright.config.ts builds and starts the site itself, with every secret blanked.
      - run: npm run test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  cms:
    name: CMS — build, integration tests, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cms/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NODE_ENV: production
      - run: npm test
      # Report-only until Strapi is upgraded past its vulnerable transitive deps (see TESTING.md).
      - name: Dependency audit (report only)
        run: npm audit --omit=dev --audit-level=critical
        continue-on-error: true
